<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Mingzy</title>
    <meta name="description" content="The page you are looking for does not exist on Mingzy. Return to the home page to start free random video or text chat." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      @media (min-width: 640px) {
        .container { padding: 4rem 2rem; }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #09060F;
        color: #f5ebfc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 500px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
      }
      .code {
        color: #FF2E93;
        font-weight: 800;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 0.75rem;
        color: #ffffff;
      }
      p {
        color: rgba(255, 255, 255, 0.65);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      @media (min-width: 480px) {
        .btn-group { flex-direction: row; justify-content: center; }
      }
      .btn-primary {
        background: #FF2E93;
        color: #ffffff;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 0.875rem;
        transition: opacity 0.2s;
      }
      .btn-primary:hover { opacity: 0.9; }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 0.875rem;
        transition: background 0.2s;
      }
      .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/images/mingzy-logo.jpg" alt="Mingzy Logo" class="logo" width="56" height="56" />
      <div class="code">404 Error</div>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
      <div class="btn-group">
        <a href="/" class="btn-primary">Go to Home</a>
        <a href="/random-video-chat" class="btn-secondary">Start Video Chat</a>
      </div>
    </div>
  </body>
</html>
