<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="safetyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B2A22" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#120A1A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09060F" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#09060F" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="450" rx="32" fill="url(#safetyBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Shield Shape -->
  <g transform="translate(300, 210)">
    <!-- Aura Glow -->
    <path d="M 0 -110 L 85 -55 C 85 45, 45 105, 0 135 C -45 105, -85 45, -85 -55 Z" 
          fill="#10B981" opacity="0.15" filter="url(#glowGreen)" />

    <!-- Outer Shield Frame -->
    <path d="M 0 -100 L 75 -50 C 75 40, 40 95, 0 120 C -40 95, -75 40, -75 -50 Z" 
          fill="#111B17" stroke="#10B981" stroke-width="2" />

    <path d="M 0 -85 L 60 -45 C 60 30, 30 75, 0 95 C -30 75, -60 30, -60 -45 Z" 
          fill="#16091D" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- Lock Icon with Heart Keyhole -->
    <g transform="translate(0, 5)">
      <!-- Shackle -->
      <path d="M -16 -8 C -16 -28, 16 -28, 16 -8 L 16 2 L -16 2 Z" fill="none" stroke="url(#neonPink)" stroke-width="4" stroke-linecap="round" />
      <!-- Body -->
      <rect x="-24" y="2" width="48" height="38" rx="10" fill="url(#neonPink)" filter="url(#glowGreen)" opacity="0.9" />
      <!-- Heart Keyhole -->
      <path d="M 0 16 C -3 12, -7 16, -7 19 C -7 23, 0 27, 0 28 C 0 27, 7 23, 7 19 C 7 16, 3 12, 0 16 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 365)">
    <rect width="185" height="36" rx="18" fill="#13071C" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10B981" />
    <text x="32" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">End-to-End Encrypted</text>
  </g>

  <g transform="translate(315, 365)">
    <rect width="185" height="36" rx="18" fill="#13071C" stroke="rgba(255,46,147,0.3)" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#FF2E93" />
    <text x="32" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Zero Data Logging</text>
  </g>
</svg>
