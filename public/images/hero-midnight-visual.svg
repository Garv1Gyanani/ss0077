<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#FF2E93" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#09060F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coralGlow" cx="80%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#FF2E93" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09060F" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="mingzyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="35%" stop-color="#D946EF" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF6B6B" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0C2B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#12071A" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="30%" stop-color="#D946EF" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF6B6B" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="organicClip1">
      <path d="M 20 0 L 380 0 Q 420 0 420 40 L 420 250 Q 420 290 380 290 L 60 290 Q 20 290 20 250 Z" />
    </clipPath>

    <clipPath id="organicClip2">
      <path d="M 60 0 L 400 0 Q 420 0 420 40 L 420 250 Q 420 290 380 290 L 20 290 Q 0 290 0 250 Z" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="#09060F" />
  <rect width="1200" height="675" fill="url(#bgGlow1)" />
  <rect width="1200" height="675" fill="url(#coralGlow)" />

  <!-- Background Stars & Particles -->
  <g opacity="0.6">
    <circle cx="120" cy="90" r="1.5" fill="#ffffff" opacity="0.6" />
    <circle cx="280" cy="140" r="2" fill="#D946EF" opacity="0.8" />
    <circle cx="950" cy="80" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="1080" cy="190" r="2" fill="#FF2E93" opacity="0.6" />
    <circle cx="80" cy="450" r="2.5" fill="#FF6B6B" opacity="0.5" />
    <circle cx="1120" cy="520" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="600" cy="100" r="2" fill="#8B5CF6" opacity="0.7" />
    <circle cx="450" cy="590" r="1.5" fill="#ffffff" opacity="0.5" />
    <circle cx="820" cy="610" r="2" fill="#D946EF" opacity="0.6" />
  </g>

  <!-- Flowing Connection Trails (Center) -->
  <path d="M 280 330 C 420 260, 520 410, 600 330 C 680 250, 780 400, 920 330" 
        fill="none" stroke="url(#lineGrad)" stroke-width="3" opacity="0.85" filter="url(#glow)" />
  
  <path d="M 280 330 C 440 380, 500 240, 600 330 C 700 420, 760 270, 920 330" 
        fill="none" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />

  <!-- Ambient Light Orbs Behind Windows -->
  <circle cx="280" cy="330" r="180" fill="#FF2E93" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="920" cy="330" r="180" fill="#D946EF" opacity="0.12" filter="url(#softGlow)" />

  <!-- Left Video Window (YOU) -->
  <g transform="translate(80, 185)">
    <!-- Outer Glow Frame -->
    <rect x="0" y="0" width="420" height="290" rx="36" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" filter="url(#glow)" />
    <rect x="0" y="0" width="420" height="290" rx="36" fill="none" stroke="url(#mingzyGrad)" stroke-width="1" opacity="0.4" />
    
    <!-- Warm Cozy Night Background Inside Video -->
    <rect x="12" y="12" width="396" height="266" rx="28" fill="#13071C" />
    
    <!-- Simulated Warm Lamp & Girl Silhouette Artwork -->
    <circle cx="340" cy="60" r="45" fill="#FFB703" opacity="0.15" filter="url(#glow)" />
    <path d="M 210 278 C 210 180, 160 160, 210 120 C 235 120, 255 140, 255 170 C 255 200, 290 230, 290 278 Z" fill="#2E1040" />
    <circle cx="210" cy="115" r="32" fill="#E879F9" opacity="0.3" />

    <!-- Audio Visualizer Wave -->
    <g transform="translate(30, 245)" fill="#FF2E93" opacity="0.9">
      <rect x="0" y="8" width="3" height="12" rx="1.5" />
      <rect x="7" y="2" width="3" height="24" rx="1.5" />
      <rect x="14" y="0" width="3" height="28" rx="1.5" />
      <rect x="21" y="6" width="3" height="16" rx="1.5" />
      <rect x="28" y="10" width="3" height="8" rx="1.5" />
    </g>

    <!-- You Tag -->
    <g transform="translate(24, 24)">
      <rect width="70" height="28" rx="14" fill="#1E0A2A" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#FF2E93" filter="url(#glow)" />
      <text x="26" y="18" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">You</text>
    </g>

    <!-- HD Audio Tag -->
    <g transform="translate(310, 24)">
      <rect width="86" height="28" rx="14" fill="#1E0A2A" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="43" y="18" fill="rgba(255,255,255,0.7)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" text-anchor="middle">Mic Active</text>
    </g>
  </g>

  <!-- Right Video Window (STRANGER) -->
  <g transform="translate(700, 185)">
    <!-- Outer Glow Frame -->
    <rect x="0" y="0" width="420" height="290" rx="36" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" filter="url(#glow)" />
    <rect x="0" y="0" width="420" height="290" rx="36" fill="none" stroke="url(#mingzyGrad)" stroke-width="1.5" opacity="0.6" />
    
    <!-- Warm Cozy Night Background Inside Video -->
    <rect x="12" y="12" width="396" height="266" rx="28" fill="#13071C" />
    
    <!-- Simulated Ambient Neon Background Inside -->
    <circle cx="80" cy="70" r="50" fill="#D946EF" opacity="0.2" filter="url(#glow)" />
    <circle cx="330" cy="220" r="40" fill="#FF6B6B" opacity="0.15" filter="url(#glow)" />
    <path d="M 210 278 C 210 180, 260 160, 210 120 C 185 120, 165 140, 165 170 C 165 200, 130 230, 130 278 Z" fill="#36124B" />
    <circle cx="210" cy="115" r="32" fill="#F43F5E" opacity="0.35" />

    <!-- Audio Visualizer Wave -->
    <g transform="translate(30, 245)" fill="#D946EF" opacity="0.9">
      <rect x="0" y="4" width="3" height="20" rx="1.5" />
      <rect x="7" y="0" width="3" height="28" rx="1.5" />
      <rect x="14" y="6" width="3" height="16" rx="1.5" />
      <rect x="21" y="2" width="3" height="24" rx="1.5" />
      <rect x="28" y="8" width="3" height="12" rx="1.5" />
    </g>

    <!-- Stranger Tag -->
    <g transform="translate(24, 24)">
      <rect width="115" height="28" rx="14" fill="#1E0A2A" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#10B981" />
      <text x="26" y="18" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Maya • Tokyo</text>
    </g>

    <!-- Mood Tag -->
    <g transform="translate(315, 24)">
      <rect width="80" height="28" rx="14" fill="#1E0A2A" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="40" y="18" fill="rgba(255,255,255,0.7)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" text-anchor="middle">✨ Midnight</text>
    </g>
  </g>

  <!-- Central Glowing Heart Emblem & CONNECTED Badge -->
  <g transform="translate(600, 330)">
    <!-- Heart Glow Outer -->
    <circle cx="0" cy="0" r="34" fill="url(#mingzyGrad)" filter="url(#glow)" opacity="0.8" />
    <circle cx="0" cy="0" r="28" fill="#16091D" stroke="url(#mingzyGrad)" stroke-width="2" />
    
    <!-- Heart Icon -->
    <path d="M 0 -8 C -7 -16, -16 -8, -16 0 C -16 10, 0 18, 0 20 C 0 18, 16 10, 16 0 C 16 -8, 7 -16, 0 -8 Z" 
          fill="url(#mingzyGrad)" />

    <!-- Connected Pill -->
    <g transform="translate(-50, 48)">
      <rect width="100" height="24" rx="12" fill="#16091D" stroke="url(#mingzyGrad)" stroke-width="1" opacity="0.9" />
      <text x="50" y="16" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">CONNECTED</text>
    </g>
  </g>

  <!-- Floating Message Chips in Space -->
  <g transform="translate(480, 160)" opacity="0.9">
    <rect width="130" height="32" rx="16" fill="#1A0A26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="65" y="20" fill="rgba(255,255,255,0.85)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">✨ "Hey from Tokyo!"</text>
  </g>

  <g transform="translate(610, 490)" opacity="0.85">
    <rect width="145" height="32" rx="16" fill="#1A0A26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="72" y="20" fill="rgba(255,255,255,0.85)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">💬 "What are you listening to?"</text>
  </g>

  <!-- Orbiting Profile Circles -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="18" fill="#250E34" stroke="url(#mingzyGrad)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#D946EF" opacity="0.4" />
    <text x="0" y="4" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">J</text>
  </g>

  <g transform="translate(1040, 130)">
    <circle cx="0" cy="0" r="18" fill="#250E34" stroke="url(#mingzyGrad)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#FF2E93" opacity="0.4" />
    <text x="0" y="4" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">E</text>
  </g>

  <g transform="translate(1020, 540)">
    <circle cx="0" cy="0" r="16" fill="#250E34" stroke="url(#mingzyGrad)" stroke-width="1" />
    <circle cx="0" cy="0" r="12" fill="#8B5CF6" opacity="0.4" />
    <text x="0" y="4" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">K</text>
  </g>

  <g transform="translate(180, 520)">
    <circle cx="0" cy="0" r="16" fill="#250E34" stroke="url(#mingzyGrad)" stroke-width="1" />
    <circle cx="0" cy="0" r="12" fill="#FF6B6B" opacity="0.4" />
    <text x="0" y="4" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Z</text>
  </g>

</svg>
