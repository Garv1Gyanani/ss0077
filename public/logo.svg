<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="80" y1="40" x2="176" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="100" y1="60" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
    <radialGradient id="orbGlow" cx="128" cy="128" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  
  <!-- Ambient glow orb -->
  <circle cx="128" cy="128" r="100" fill="url(#orbGlow)"/>
  
  <!-- Outer glow of bolt -->
  <path filter="url(#outerGlow)" d="M140.5 42c1.2-2.1 4.3-1.3 4.3 1.1v55.4c0 3.1 2.5 5.7 5.7 5.7h29.2c2.3 0 3.7 2.6 2.3 4.5L127.7 214c-1.2 2.1-4.3 1.3-4.3-1.1v-62.4c0-3.1-2.5-5.7-5.7-5.7H82.3c-2.3 0-3.7-2.6-2.3-4.5L140.5 42z" fill="#a855f7" opacity="0.4"/>
  
  <!-- Main lightning bolt -->
  <path filter="url(#glow)" d="M140.5 42c1.2-2.1 4.3-1.3 4.3 1.1v55.4c0 3.1 2.5 5.7 5.7 5.7h29.2c2.3 0 3.7 2.6 2.3 4.5L127.7 214c-1.2 2.1-4.3 1.3-4.3-1.1v-62.4c0-3.1-2.5-5.7-5.7-5.7H82.3c-2.3 0-3.7-2.6-2.3-4.5L140.5 42z" fill="url(#boltGrad)"/>
  
  <!-- Light streak highlight -->
  <path d="M140.5 42c1.2-2.1 4.3-1.3 4.3 1.1v55.4c0 3.1 2.5 5.7 5.7 5.7h29.2c2.3 0 3.7 2.6 2.3 4.5l-20 28" stroke="url(#glowGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Subtle ring -->
  <rect x="4" y="4" width="248" height="248" rx="52" stroke="white" stroke-opacity="0.06" stroke-width="1" fill="none"/>
</svg>
