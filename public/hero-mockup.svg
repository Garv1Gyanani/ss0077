<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0816"/>
      <stop offset="50%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#06060d"/>
    </linearGradient>
    <linearGradient id="card1" x1="60" y1="80" x2="560" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <linearGradient id="card2" x1="640" y1="80" x2="1140" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1a1a"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <linearGradient id="avatarGrad1" x1="250" y1="200" x2="370" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="avatarGrad2" x1="830" y1="200" x2="950" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="550" y1="280" x2="650" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="card1Clip">
      <rect x="60" y="80" width="500" height="440" rx="24"/>
    </clipPath>
    <clipPath id="card2Clip">
      <rect x="640" y="80" width="500" height="440" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Ambient glow orbs -->
  <circle cx="300" cy="300" r="200" fill="#7c3aed" opacity="0.04" filter="url(#glow1)"/>
  <circle cx="900" cy="350" r="200" fill="#059669" opacity="0.04" filter="url(#glow1)"/>
  <circle cx="600" cy="340" r="150" fill="#a855f7" opacity="0.06" filter="url(#glow1)"/>

  <!-- Left video card -->
  <rect x="60" y="80" width="500" height="440" rx="24" fill="url(#card1)" stroke="white" stroke-opacity="0.06"/>
  
  <!-- Left card content -->
  <g clip-path="url(#card1Clip)">
    <!-- Gradient background circles -->
    <circle cx="200" cy="200" r="180" fill="#7c3aed" opacity="0.06"/>
    <circle cx="400" cy="400" r="120" fill="#a855f7" opacity="0.04"/>
    
    <!-- Avatar silhouette -->
    <circle cx="310" cy="260" r="65" fill="url(#avatarGrad1)" opacity="0.2"/>
    <circle cx="310" cy="240" r="30" fill="url(#avatarGrad1)" opacity="0.3"/>
    <path d="M260 310 Q310 280 360 310 Q370 340 370 370 L250 370 Q250 340 260 310Z" fill="url(#avatarGrad1)" opacity="0.25"/>
    
    <!-- Waveform visualization -->
    <g transform="translate(160, 400)" opacity="0.5">
      <rect x="0" y="10" width="4" height="20" rx="2" fill="#a855f7"/>
      <rect x="10" y="5" width="4" height="30" rx="2" fill="#a855f7"/>
      <rect x="20" y="0" width="4" height="40" rx="2" fill="#c084fc"/>
      <rect x="30" y="8" width="4" height="24" rx="2" fill="#a855f7"/>
      <rect x="40" y="2" width="4" height="36" rx="2" fill="#c084fc"/>
      <rect x="50" y="12" width="4" height="16" rx="2" fill="#a855f7"/>
      <rect x="60" y="6" width="4" height="28" rx="2" fill="#a855f7"/>
      <rect x="70" y="0" width="4" height="40" rx="2" fill="#c084fc"/>
      <rect x="80" y="10" width="4" height="20" rx="2" fill="#a855f7"/>
      <rect x="90" y="4" width="4" height="32" rx="2" fill="#a855f7"/>
      <rect x="100" y="8" width="4" height="24" rx="2" fill="#c084fc"/>
      <rect x="110" y="14" width="4" height="12" rx="2" fill="#a855f7"/>
      <rect x="120" y="6" width="4" height="28" rx="2" fill="#a855f7"/>
      <rect x="130" y="2" width="4" height="36" rx="2" fill="#c084fc"/>
      <rect x="140" y="10" width="4" height="20" rx="2" fill="#a855f7"/>
      <rect x="150" y="0" width="4" height="40" rx="2" fill="#c084fc"/>
      <rect x="160" y="8" width="4" height="24" rx="2" fill="#a855f7"/>
      <rect x="170" y="12" width="4" height="16" rx="2" fill="#a855f7"/>
      <rect x="180" y="4" width="4" height="32" rx="2" fill="#c084fc"/>
    </g>
    
    <!-- "You" label -->
    <rect x="80" y="100" width="64" height="28" rx="14" fill="white" fill-opacity="0.06"/>
    <text x="112" y="119" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">You</text>
  </g>

  <!-- Right video card -->
  <rect x="640" y="80" width="500" height="440" rx="24" fill="url(#card2)" stroke="white" stroke-opacity="0.06"/>
  
  <!-- Right card content -->
  <g clip-path="url(#card2Clip)">
    <!-- Gradient background circles -->
    <circle cx="800" cy="200" r="180" fill="#059669" opacity="0.06"/>
    <circle cx="1000" cy="400" r="120" fill="#34d399" opacity="0.04"/>
    
    <!-- Avatar silhouette -->
    <circle cx="890" cy="260" r="65" fill="url(#avatarGrad2)" opacity="0.2"/>
    <circle cx="890" cy="240" r="30" fill="url(#avatarGrad2)" opacity="0.3"/>
    <path d="M840 310 Q890 280 940 310 Q950 340 950 370 L830 370 Q830 340 840 310Z" fill="url(#avatarGrad2)" opacity="0.25"/>
    
    <!-- Waveform visualization -->
    <g transform="translate(740, 400)" opacity="0.5">
      <rect x="0" y="8" width="4" height="24" rx="2" fill="#34d399"/>
      <rect x="10" y="2" width="4" height="36" rx="2" fill="#34d399"/>
      <rect x="20" y="10" width="4" height="20" rx="2" fill="#6ee7b7"/>
      <rect x="30" y="0" width="4" height="40" rx="2" fill="#34d399"/>
      <rect x="40" y="6" width="4" height="28" rx="2" fill="#34d399"/>
      <rect x="50" y="14" width="4" height="12" rx="2" fill="#6ee7b7"/>
      <rect x="60" y="4" width="4" height="32" rx="2" fill="#34d399"/>
      <rect x="70" y="10" width="4" height="20" rx="2" fill="#34d399"/>
      <rect x="80" y="0" width="4" height="40" rx="2" fill="#6ee7b7"/>
      <rect x="90" y="8" width="4" height="24" rx="2" fill="#34d399"/>
      <rect x="100" y="2" width="4" height="36" rx="2" fill="#6ee7b7"/>
      <rect x="110" y="12" width="4" height="16" rx="2" fill="#34d399"/>
      <rect x="120" y="4" width="4" height="32" rx="2" fill="#34d399"/>
      <rect x="130" y="0" width="4" height="40" rx="2" fill="#6ee7b7"/>
      <rect x="140" y="10" width="4" height="20" rx="2" fill="#34d399"/>
      <rect x="150" y="6" width="4" height="28" rx="2" fill="#34d399"/>
      <rect x="160" y="2" width="4" height="36" rx="2" fill="#6ee7b7"/>
      <rect x="170" y="14" width="4" height="12" rx="2" fill="#34d399"/>
      <rect x="180" y="8" width="4" height="24" rx="2" fill="#6ee7b7"/>
    </g>
    
    <!-- "Stranger" label -->
    <rect x="660" y="100" width="96" height="28" rx="14" fill="white" fill-opacity="0.06"/>
    <text x="708" y="119" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Stranger</text>
  </g>

  <!-- Center connection indicator -->
  <circle cx="600" cy="300" r="28" fill="url(#pulseGrad)" opacity="0.15" filter="url(#glow2)"/>
  <circle cx="600" cy="300" r="20" fill="#0e0e1a" stroke="url(#pulseGrad)" stroke-width="2"/>
  
  <!-- Connection bolt icon -->
  <path d="M604 288 L596 302 L602 302 L598 312 L606 298 L600 298 L604 288Z" fill="url(#pulseGrad)"/>
  
  <!-- Connection lines -->
  <line x1="560" y1="300" x2="572" y2="300" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="628" y1="300" x2="640" y2="300" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Bottom control bar -->
  <rect x="380" y="570" width="440" height="56" rx="28" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.06"/>
  
  <!-- Mic button -->
  <circle cx="440" cy="598" r="20" fill="white" fill-opacity="0.06"/>
  <rect x="436" y="586" width="8" height="14" rx="4" fill="white" fill-opacity="0.5"/>
  <path d="M432 596 Q432 606 440 606 Q448 606 448 596" stroke="white" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
  <line x1="440" y1="606" x2="440" y2="611" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  
  <!-- Camera button -->
  <circle cx="510" cy="598" r="20" fill="white" fill-opacity="0.06"/>
  <rect x="498" y="591" width="18" height="12" rx="3" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M516 594 L522 591 L522 605 L516 602Z" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  
  <!-- End call button -->
  <circle cx="600" cy="598" r="24" fill="#ef4444" fill-opacity="0.8"/>
  <path d="M586 598 Q586 590 594 588 L596 592 Q592 594 592 598 Q592 602 596 604 L594 608 Q586 606 586 598Z M614 598 Q614 590 606 588 L604 592 Q608 594 608 598 Q608 602 604 604 L606 608 Q614 606 614 598Z" fill="white" fill-opacity="0.9"/>
  
  <!-- Screen share button -->
  <circle cx="690" cy="598" r="20" fill="white" fill-opacity="0.06"/>
  <rect x="678" y="589" width="18" height="12" rx="2" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="687" y1="601" x2="687" y2="605" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="682" y1="605" x2="692" y2="605" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M687 596 L683 600 M687 596 L691 600 M687 596 L687 592" stroke="white" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
  
  <!-- Next button -->
  <circle cx="760" cy="598" r="20" fill="#7c3aed" fill-opacity="0.3" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
  <path d="M754 593 L762 598 L754 603Z M762 593 L770 598 L762 603Z" fill="white" fill-opacity="0.6"/>

  <!-- Timer pill top center -->
  <rect x="548" y="30" width="104" height="32" rx="16" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.06"/>
  <circle cx="572" cy="46" r="4" fill="#34d399"/>
  <text x="600" y="51" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">02:34</text>

  <!-- Online users pill -->
  <rect x="40" y="600" width="140" height="32" rx="16" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.04"/>
  <circle cx="60" cy="616" r="4" fill="#34d399"/>
  <text x="110" y="621" text-anchor="middle" fill="white" fill-opacity="0.3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">4,281 online</text>
</svg>
